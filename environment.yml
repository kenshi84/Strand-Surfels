name: strand-surfels
channels:
  # the CUDA 12.4 toolkit label must come first (strict channel priority)
  - nvidia/label/cuda-12.4.0
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip=24.2
  - setuptools
  - wheel
  - ninja

  # PyTorch 2.4 with CUDA 12.4
  - pytorch=2.4.*
  - pytorch-cuda=12.4

  # CUDA 12.4 toolkit (nvcc, headers, dev libraries), needed to compile the
  # package's CUDA extensions; must match the CUDA version of pytorch-cuda
  - cuda-toolkit=12.4.0

  - pip:
      # runtime
      - numpy==2.0.2
      - scipy==1.17.0
      - fury==2.0.0
      - pillow==10.4.0
      - pyyaml==6.0
      - tqdm==4.67.1
      - jaxtyping==0.3.9
      - polyscope==2.5.0
      - tensorboard==2.20.0
      # development: formatting, linting, tests
      - black==26.1.0
      - isort==7.0.0
      - pylint==4.0.4
      - pytest==9.0.2
